name: Deploy Knowledgeverse showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate showcase
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
